<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Example</title>
    <style>
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }

        .modal-content {
            background-color: white;
            margin: 10% auto;
            padding: 20px;
            width: 80%;
            max-width: 500px;
            border-radius: 5px;
            position: relative;
        }

        .close-modal {
            position: absolute;
            right: 15px;
            top: 10px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            background: none;
            border: none;
        }
    </style>
</head>
<body>
    <button id="login-btn">Login</button>
    <button id="signup-btn">Sign Up</button>

    <!-- Login Modal -->
    <div id="login-modal" class="modal">
        <div class="modal-content">
            <button class="close-modal" aria-label="Close modal">&times;</button>
            <h2>Log In</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="login-email" class="form-label">Email</label>
                    <input type="email" id="login-email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="login-password" class="form-label">Password</label>
                    <input type="password" id="login-password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary">Log In</button>
            </form>
            <p style="margin-top: 1rem; text-align: center;">
                <a href="#" id="forgot-password-link">Forgot Password?</a>
            </p>
        </div>
    </div>

    <!-- Sign Up Modal -->
    <div id="signup-modal" class="modal">
        <div class="modal-content">
            <button class="close-modal" aria-label="Close modal">&times;</button>
            <h2>Sign Up</h2>
            <form id="signup-form">
                <div class="form-group">
                    <label for="signup-name" class="form-label">Full Name</label>
                    <input type="text" id="signup-name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="signup-email" class="form-label">Email</label>
                    <input type="email" id="signup-email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="signup-password" class="form-label">Password</label>
                    <input type="password" id="signup-password" class="form-control" required>
                    <small id="password-help" class="text-muted">Password must be at least 8 characters with uppercase, lowercase, number and special character</small>
                </div>
                <div class="form-group">
                    <label for="user-type" class="form-label">I am a:</label>
                    <select id="user-type" class="form-control" required>
                        <option value="">Select an option</option>
                        <option value="student">Student</option>
                        <option value="teacher">Teacher</option>
                        <option value="parent">Parent/Guardian</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="accessibility-needs" class="form-label">Accessibility Needs (Optional)</label>
                    <select id="accessibility-needs" class="form-control" multiple>
                        <option value="visual">Visual Impairment</option>
                        <option value="hearing">Hearing Impairment</option>
                        <option value="motor">Motor Skills Limitation</option>
                        <option value="cognitive">Cognitive/Learning Difference</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Create Account</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Get modal elements
            const loginModal = document.getElementById('login-modal');
            const signupModal = document.getElementById('signup-modal');
            
            // Get buttons that open modals
            const loginBtn = document.getElementById('login-btn');
            const signupBtn = document.getElementById('signup-btn');
            
            // Get close buttons
            const closeButtons = document.querySelectorAll('.close-modal');
            
            // Function to open modal
            function openModal(modal) {
                modal.style.display = 'block';
            }
            
            // Function to close modal
            function closeModal(modal) {
                modal.style.display = 'none';
            }
            
            // Event listeners for opening modals
            if (loginBtn) {
                loginBtn.addEventListener('click', () => openModal(loginModal));
            }
            
            if (signupBtn) {
                signupBtn.addEventListener('click', () => openModal(signupModal));
            }
            
            // Event listeners for closing modals
            closeButtons.forEach(button => {
                button.addEventListener('click', function() {
                    const modal = this.closest('.modal');
                    closeModal(modal);
                });
            });
            
            // Close modal when clicking outside of it
            window.addEventListener('click', function(event) {
                if (event.target.classList.contains('modal')) {
                    closeModal(event.target);
                }
            });
        });
    </script>
</body>
</html>
